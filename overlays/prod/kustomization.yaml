apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ske-prod
namePrefix: prod-
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: order-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/args/1
        value: "-text=SKE Order Service v1.0 | Msg: $(WELCOME_MSG) | Env: $(APP_ENV) | Key: $(API_KEY)"
  - target:
      kind: Ingress
      name: order-service-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: prod.order.ske.local
