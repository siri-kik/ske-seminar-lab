apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ske-dev
namePrefix: dev-
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: order-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/args/1
        value: "-text=SKE Order Service v1.0 (dev) | Msg: $(WELCOME_MSG) | Env: $(APP_ENV)"
  - target:
      kind: HorizontalPodAutoscaler
      name: order-service-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target:
      kind: Ingress
      name: order-service-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.order.ske.local
